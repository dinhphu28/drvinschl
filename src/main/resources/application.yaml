spring:
  application:
    name: drvinschl
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:drvinschl}?currentSchema=${DB_SCHEMA:sch_drvinschl}
    username: ${DB_USER:drvinschl}
    password: ${DB_PASSWORD:drvinschl}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Use 'update' for local dev, 'validate' or 'none' for production
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:sch_drvinschl}

  # # 3. Database Migration Configuration (Flyway)
  # flyway:
  #   enabled: ${FLYWAY_ENABLED:true}
  #   schemas: ${DB_SCHEMA:public}
